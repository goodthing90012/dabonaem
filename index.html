<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다보냄">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>다보냄 — 물류센터 패킹 게임</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e9ebef;color:#1f2937;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:2px solid #e4e4e7;z-index:3}
.stat{display:flex;align-items:center;gap:4px;background:#f4f4f5;border-radius:12px;padding:5px 9px;font-size:13px;white-space:nowrap;font-weight:600}
.stat b{font-variant-numeric:tabular-nums}
.stat.money{background:#dcfce7;color:#166534;font-size:15px}
.stat.money small{font-size:10px;color:#dc2626;font-weight:800}
.stat.money.indebt{background:#fef3c7}
.stat.warn{background:#fee2e2;color:#991b1b}
#hud .sp{flex:1}
#menuBtn,#mktBtn,#salesBtn{border:0;background:#f4f4f5;border-radius:12px;width:36px;height:32px;font-size:16px;cursor:pointer;position:relative;flex:0 0 auto}
#mktBtn{background:#fce7f3}
#salesBtn{background:#ccfbf1}
#mktBtn i,#salesBtn i{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#ef4444;display:none}
#mktBtn.ready i,#salesBtn.ready i{display:block}
#boostBar{display:flex;gap:4px;overflow:hidden}
#boostBar span{background:#fce7f3;color:#9d174d;border-radius:10px;padding:4px 7px;font-size:12px;font-weight:700;white-space:nowrap}
#goal{background:#18181b;color:#fff;padding:5px 10px 6px;font-size:12px;font-weight:700;z-index:3}
#goal #goalText{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
#goal .gbar{height:5px;border-radius:3px;background:#3f3f46;margin-top:4px;overflow:hidden}
#goal .gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#34d399);border-radius:3px;transition:width .3s}
#ending{position:fixed;inset:0;background:rgba(9,9,11,.75);display:flex;align-items:center;justify-content:center;z-index:12}
#ending .box{background:#fff;border-radius:20px;padding:22px 20px 16px;width:min(340px,92vw);text-align:center}
#ending h2{font-size:22px;margin-bottom:4px}
#ending .big{font-size:34px;font-weight:900;margin:8px 0;font-variant-numeric:tabular-nums}
#ending p{font-size:13px;color:#52525b;margin:4px 0}
#ending button{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
#endContinue{background:#18181b;color:#fff}
#gameover{position:fixed;inset:0;background:rgba(9,9,11,.78);display:flex;align-items:center;justify-content:center;z-index:12}
#gameover .box{background:#fff;border-radius:20px;padding:22px 20px 16px;width:min(340px,92vw);text-align:center}
#gameover h2{font-size:22px;margin-bottom:6px}
#gameover .big{font-size:30px;font-weight:900;margin:8px 0}
#gameover p{font-size:13px;color:#52525b;margin:4px 0;line-height:1.5}
#gameover button{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
#goRetry{background:#f59e0b;color:#fff}
#goNew{background:#f4f4f5;color:#18181b}
#endNew{background:#f4f4f5;color:#18181b}
#banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);padding:5px 12px;border-radius:12px;font-size:12px;font-weight:800;text-align:center;background:#fef3c7;color:#92400e;z-index:4;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18);width:max-content;white-space:normal}
#banner.live{background:#fee2e2;color:#991b1b}
@keyframes pulse{to{background:#fecaca}}
.hidden{display:none!important}
#stage{position:relative;flex:1;min-height:0}
#cv,#bgcv,#pilecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bgcv,#pilecv{pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:56dvh;display:flex;flex-direction:column;background:#fff;
  border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);z-index:5;padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(calc(100% + 40px));transition:transform .22s ease}
#sheet.open{transform:none}
#sheetHead{display:flex;align-items:center;padding:12px 14px 8px}
#sheetHead h3{flex:1;font-size:16px}
#sheetClose{border:0;background:#f4f4f5;border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#d4d4d8;margin:8px auto 0}
#rows{overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f4f4f5}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.info{flex:1;min-width:0}
.info .t{font-size:14px;font-weight:700}
.info .d{font-size:12px;color:#71717a;margin-top:2px}
.row button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;flex:0 0 auto;border:0;border-radius:12px;padding:9px 10px;min-width:98px;font-size:13px;font-weight:700;font-family:inherit;
  background:#3b82f6;color:#fff;cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #1d4ed8}
.row button:disabled{background:#e4e4e7;color:#a1a1aa;cursor:default;box-shadow:0 3px 0 #d4d4d8}
.row button.alt{background:#8b5cf6;box-shadow:0 3px 0 #6d28d9}
.row button:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #1d4ed8}
#rebirth{position:fixed;inset:0;background:rgba(9,9,11,.55);display:flex;align-items:center;justify-content:center;z-index:11}
#rebirth .box{background:#fff;border-radius:20px;padding:18px 16px 14px;width:min(380px,94vw);max-height:90dvh;overflow:auto}
#rebirth h2{font-size:20px;margin-bottom:4px}
#rebirth h3{font-size:15px;margin:14px 0 4px;display:flex;justify-content:space-between;align-items:center}
#rebirth h3 span{font-size:14px;color:#a16207}
#rebirth p{font-size:13px;color:#52525b;line-height:1.5}
#rebirth button{font-family:inherit;cursor:pointer;border:0}
#rbGo{width:100%;margin-top:10px;border-radius:14px;padding:12px;font-size:15px;font-weight:900;background:linear-gradient(#a78bfa,#7c3aed);color:#fff}
#rbGo:disabled{background:#e4e4e7;color:#a1a1aa}
#rbGo.arm{background:linear-gradient(#f87171,#dc2626)}
#rbClose{width:100%;margin-top:12px;border-radius:12px;padding:11px;font-size:14px;font-weight:700;background:#f4f4f5}
.rbRow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #f4f4f5}
.rbRow .i{flex:1;min-width:0}
.rbRow .t{font-size:13.5px;font-weight:800}
.rbRow .d{font-size:11.5px;color:#71717a;margin-top:2px}
.rbRow button{flex:0 0 auto;min-width:70px;border-radius:12px;padding:9px 8px;font-size:13px;font-weight:800;background:linear-gradient(#fcd34d,#f59e0b);color:#451a03}
.rbRow button:disabled{background:#ececef;color:#a1a1aa}
#endRebirth{background:linear-gradient(#a78bfa,#7c3aed)!important;color:#fff!important}
#rebirthBtn{background:#f5f3ff;color:#6d28d9}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
#menu .box{background:#fff;border-radius:18px;padding:20px;width:min(320px,90vw)}
#menu h2{font-size:18px;margin-bottom:4px}
#menu p{font-size:13px;color:#52525b;margin:6px 0}
#menu button{width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
#closeMenu{background:#3b82f6;color:#fff}
#report{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:11}
#report .box{background:#fff;border-radius:18px;padding:18px 18px 14px;width:min(340px,92vw);max-height:90dvh;overflow:auto}
#report h2{font-size:18px;margin-bottom:8px}
#report table{width:100%;font-size:13px;border-collapse:collapse}
#report td{padding:4px 2px;border-bottom:1px solid #f4f4f5}
#report td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
#report tr.minus td:last-child{color:#dc2626}
#report tr.plus td:last-child{color:#16a34a}
#report tr.sum td{border-top:2px solid #e4e4e7;font-size:15px}
#report .note{font-size:12px;color:#71717a;margin-top:8px}
#report button{width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
#nextDay{background:#f59e0b;color:#fff}
#repayBtn,#menuRepay{background:#ecfdf5;color:#047857}
#spinBtn{background:#eff6ff;color:#1d4ed8}
#soundBtn{background:#f4f4f5;color:#27272a}
#resetBtn{background:#fee2e2;color:#991b1b}
@media (max-width:430px){
  #hud{gap:4px;padding:7px 6px}
  .stat{padding:4px 6px;font-size:12px;gap:2px}
  .stat.money{font-size:13px}
  #menuBtn,#mktBtn,#salesBtn{width:30px;height:30px;font-size:14px}
  #boostBar span{padding:3px 5px;font-size:11px}
}
#hud{overflow:hidden}
#boostBar{min-width:0}
@media (min-width:860px){
  #sheet{left:auto;right:14px;bottom:14px;width:400px;border-radius:20px;max-height:70dvh}
}

/* ── 다듬기: HUD·시트 ── */
#hud{border-bottom:0;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.stat{background:#f4f4f6;box-shadow:inset 0 0 0 1px rgba(15,23,42,.05);font-weight:700}
.stat.money{background:linear-gradient(#e7fbef,#d3f5e1);box-shadow:inset 0 0 0 1px rgba(22,101,52,.12);font-weight:800}
#menuBtn,#mktBtn,#salesBtn{box-shadow:0 2px 0 rgba(15,23,42,.08)}
#goal{background:linear-gradient(90deg,#1e1b4b,#18181b)}
#goal .gbar{background:rgba(255,255,255,.12);height:6px;border-radius:3px}
#goal .gbar i{background:linear-gradient(90deg,#a78bfa,#38bdf8,#34d399);box-shadow:0 0 8px rgba(52,211,153,.5)}
#sheet{border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(15,23,42,.18)}
#sheetHead h3{font-size:17px;font-weight:800}
.row{padding:12px 2px}
.info .t{font-weight:800}
.row button{background:linear-gradient(#4f8ef7,#3b82f6);border-radius:14px}
.row button.alt{background:linear-gradient(#9b74f7,#8b5cf6)}
.row button:disabled{background:#ececef}
.stat.money .mcol{display:flex;flex-direction:column;line-height:1.05}
.stat.money .mrow{display:flex;align-items:baseline;gap:2px}
#moneyStat .mrow small{font-size:9.5px}
#earned{font-style:normal;font-size:9.5px;font-weight:700;color:#15803d;opacity:.85;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat money" id="moneyStat">💰<span class="mcol"><b id="money">0</b><span class="mrow"><em id="earned"></em><small id="debt"></small></span></span></div>
    <div class="stat" id="stockStat">📦<b id="stock">0</b></div>
    <div class="stat" id="clockStat">🕘<b id="clock">D1 09:00</b></div>
    <div id="boostBar"></div>
    <div class="sp"></div>
    <button id="salesBtn" aria-label="화주사 영업">📋<i></i></button>
    <button id="mktBtn" aria-label="마케팅">📣<i></i></button>
    <button id="menuBtn" aria-label="메뉴">⚙︎</button>
  </header>
  <div id="goal"><div id="goalText"></div><div class="gbar"><i id="goalFill"></i></div></div>
  <div id="stage"><canvas id="bgcv"></canvas><canvas id="pilecv"></canvas><canvas id="cv"></canvas><div id="banner" class="hidden"></div></div>
</div>
<div id="sheet">
  <div class="grab"></div>
  <div id="sheetHead"><h3 id="sheetTitle"></h3><button id="sheetClose" aria-label="닫기">✕</button></div>
  <div id="rows"></div>
</div>
<div id="gameover" class="hidden">
  <div class="box">
    <h2 id="goTitle"></h2>
    <p id="goReason"></p>
    <div class="big" id="goDay"></div>
    <p id="goStats"></p>
    <button id="goRetry"></button>
    <button id="goNew">처음부터 새로</button>
  </div>
</div>
<div id="ending" class="hidden">
  <div class="box">
    <h2>🌍 전 인류 커버 완료!</h2>
    <p>82억 명의 주문을 다 보냄</p>
    <div class="big" id="endTime"></div>
    <p id="endBest"></p>
    <p id="endStats"></p>
    <button id="endContinue">무한 모드로 계속하기</button>
    <button id="endRebirth">🌀 환생하기</button>
    <button id="endNew">새 게임 (기록 도전)</button>
  </div>
</div>
<div id="report" class="hidden">
  <div class="box">
    <h2 id="repTitle"></h2>
    <div id="repBody"></div>
    <button id="repayBtn"></button>
    <button id="nextDay">다음 날 시작 ☀️</button>
  </div>
</div>
<div id="rebirth" class="hidden">
  <div class="box">
    <h2>🌀 환생</h2>
    <p id="rbInfo"></p>
    <button id="rbGo"></button>
    <h3>⭐ 명성 상점 <span id="rbFame"></span></h3>
    <div id="rbRows"></div>
    <button id="rbClose">닫기</button>
  </div>
</div>
<div id="menu" class="hidden">
  <div class="box">
    <h2>📦 다보냄</h2>
    <p id="statsText"></p>
    <button id="menuRepay"></button>
    <button id="soundBtn"></button>
    <button id="spinBtn"></button>
    <button id="rebirthBtn">🌀 환생 · 명성 상점</button>
    <button id="closeMenu">계속하기</button>
    <button id="resetBtn">처음부터 다시</button>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
// ═════ 목표: 전 인류의 주문 커버 ═════
const WORLD = 8.2e9;                                     // 세계 인구 약 82억 명
const STAGES = [
  {name:'우리 동네', icon:'🏘️', goal:1e4},
  {name:'서울',      icon:'🏙️', goal:9.4e6},
  {name:'대한민국',  icon:'🇰🇷', goal:5.1e7},
  {name:'아시아',    icon:'🌏', goal:4.7e9},
  {name:'전 인류',   icon:'🌍', goal:WORLD},
];
const AUTO_BASE = 3000, AUTO_G = 6, AUTO_M = 1.25, STAGE_BOOST = 5; // 시뮬레이션 튜닝(v85): 가끔 업그레이드하는 플레이 ~46분, 느긋한 플레이 ~75분
const CH_N = 1.18, TIER_N = 1.3, PRICE_M = 2, IN_M = 3, N_M = 1;   // 단가 ×2 · 주문 3배 · 1묶음 = 최소 1건 (처리한 만큼 출고가 바로 오름)
    // 채널 연동·새 레일도 물량 단위를 키움 · 단가 +60%
const AUTO_NAMES = ['포장 작업대', '핸드 스캐너', '컨베이어', '자동 포장기', '소터', 'AGV 로봇', '로봇 피킹', '다크 팩토리', '글로벌 풀필먼트'];
const SCALE = 3;                 // 물량 배율: 주문 ×3, 건당 금액 ÷3, 원 한 바퀴 = 3건
const UNIT_COST = 50, SAVE_KEY = 'dabonaettung-v1', TAU = Math.PI * 2;
const OUT = '#3f3f46';

// ═════ 데이터 ═════
const CH = [
  {id:'excel',    name:'엑셀/단건',     short:'엑셀',   color:'#14b8a6', unlock:0,     rate:0.12, price:800},
  {id:'cafe24',   name:'카페24',        short:'카페24', color:'#3b82f6', unlock:2500,  rate:0.18, price:1000},
  {id:'playauto', name:'플레이오토',     short:'플오',   color:'#8b5cf6', unlock:12000, rate:0.20, price:1000, st:1},
  {id:'coupang',  name:'쿠팡',          short:'쿠팡',   color:'#ef4444', unlock:9000,  rate:0.30, price:1100, via:'playauto', st:1},
  {id:'naver',    name:'네이버 스토어',  short:'네이버', color:'#22c55e', unlock:16000, rate:0.28, price:1200, via:'playauto', st:1},
  {id:'gmarket',  name:'지마켓',        short:'G마켓',  color:'#f59e0b', unlock:25000, rate:0.26, price:1300, via:'playauto', st:1},
  {id:'st11',     name:'11번가',        short:'11번가', color:'#ec4899', unlock:20000, rate:0.30, price:1100, via:'playauto', trait:'📦 볼륨형', st:1},
  {id:'kakao',    name:'카카오 선물하기', short:'선물',  color:'#facc15', unlock:22000, rate:0.05, price:1500, via:'playauto', gift:true, trait:'🎁 평소 조용, 이벤트 땐 ×5', st:2},
  {id:'musinsa',  name:'무신사',        short:'무신사', color:'#27272a', unlock:30000, rate:0.12, price:2400, via:'playauto', trait:'💎 고단가', st:2},
  {id:'ohouse',   name:'오늘의집',      short:'오집',   color:'#06b6d4', unlock:35000, rate:0.18, price:2700, via:'playauto', size:2, trait:'🛋️ 대형 — 원 2바퀴에 1건', st:3},
  {id:'shopee',   name:'쇼피 역직구',    short:'쇼피',   color:'#ea580c', unlock:40000, rate:0.22, price:2000, deadline:35, trait:'✈️ 고단가 · 마감 35초', st:3},
  {id:'ably',     name:'에이블리',      short:'에이블리', color:'#e11d48', unlock:30000,  rate:0.40, price:700,  st:1, trait:'👗 볼륨형 · 저단가'},
  {id:'kurly',    name:'컬리',          short:'컬리',   color:'#6d28d9', unlock:300000, rate:0.22, price:2200, st:2, deadline:30, urgent:0.35, trait:'🌙 새벽배송 · 마감 30초 · ⚡긴급 많음'},
  {id:'olive',    name:'올리브영',      short:'올영',   color:'#65a30d', unlock:400000, rate:0.25, price:1500, st:2, evBoost:4, trait:'💄 이벤트 땐 주문 ×4'},
  {id:'cm29',     name:'29CM',          short:'29CM',   color:'#475569', unlock:500000, rate:0.12, price:3000, st:2, trait:'💎 고단가 편집숍'},
  {id:'tiktok',   name:'틱톡샵',        short:'틱톡',   color:'#db2777', unlock:5e6,    rate:0.50, price:1400, st:3, burst:true, trait:'📱 라이브: 30초마다 5초간 몰아치기'},
  {id:'rakuten',  name:'라쿠텐',        short:'라쿠텐', color:'#b91c1c', unlock:8e6,    rate:0.25, price:2600, st:3, trait:'✈️ 일본 역직구 · 고단가'},
  {id:'amazon',   name:'아마존',        short:'아마존', color:'#ca8a04', unlock:8e7,    rate:1.20, price:1200, st:4, trait:'🌍 초대형 볼륨 (막판 러시)'},
];
CH.forEach(c => { c.rate *= SCALE; c.price = Math.round(c.price / SCALE / 10) * 10; });
const BRANDS = [

function fmt(n){

// ═════ 사운드: 음원 없이 Web Audio로 합성 (금고 다이얼 느낌) ═════
const SFX = (() => {
  let ac = null, master = null, noise = null, lastGrind = 0;
  function ensure(){
    if(!S.sound) return null;
    if(!ac){
      try{
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
        noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.3), ac.sampleRate);
        const d = noise.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }catch(e){ ac = null; return null; }
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(g, t, peak, attack, decay){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function noiseHit(t, type, freq, q, peak, decay){
    const s = ac.createBufferSource(); s.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); env(g, t, peak, 0.002, decay);
    s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 0.2); s.stop(t + decay + 0.02);
  }
  function tone(t, type, f0, f1, peak, decay){
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + decay);
    const g = ac.createGain(); env(g, t, peak, 0.003, decay);
    o.connect(g).connect(master); o.start(t); o.stop(t + decay + 0.02);
  }
  let lastPack = 0, packStep = 0;
  return {
    unlock: ensure,
    // 📦 상자 포장 완료: 테이프 '착' + 통통 튀는 뽁 (연달아 나면 음이 조금씩 올라감, 너무 잦으면 건너뜀)
    pack(){ if(!ensure()) return; const t = ac.currentTime;
      if(t - lastPack < 0.07) return;
      packStep = t - lastPack < 0.6 ? (packStep + 1) % 8 : 0; lastPack = t;
      const f = 520 * Math.pow(1.06, packStep);
      noiseHit(t, 'highpass', 2500, 0.7, 0.18, 0.04);
      tone(t + 0.01, 'sine', f * 1.6, f, 0.22, 0.09);
      tone(t + 0.01, 'triangle', f * 0.5, f * 0.45, 0.12, 0.07); },
    // 다이얼 딸깍: 짧고 건조한 금속 클릭
    tick(){ if(!ensure()) return; const t = ac.currentTime;
      noiseHit(t, 'bandpass', 3000 + Math.random() * 900, 9, 0.45, 0.025);
      tone(t, 'square', 2400, 1800, 0.035, 0.012); },
    // 잠금쇠 철컥: 금속 걸림 + 묵직한 쿵
    clunk(){ if(!ensure()) return; const t = ac.currentTime;
      noiseHit(t, 'bandpass', 1500, 4, 0.6, 0.05);
      tone(t, 'sine', 170, 60, 0.55, 0.16);
      noiseHit(t + 0.035, 'highpass', 4200, 1, 0.22, 0.03); },
    // 모터 한계: 낮게 그르릉
    grind(){ if(!ensure()) return; const nowT = performance.now(); if(nowT - lastGrind < 140) return; lastGrind = nowT;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 48 + Math.random() * 8;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      const g = ac.createGain(); env(g, t, 0.18, 0.01, 0.13);
      o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.16);
      noiseHit(t, 'lowpass', 600, 1, 0.12, 0.12); },
    // 콤보 띵: 콤보가 오를수록 음이 높아짐
    ding(step){ if(!ensure()) return; const t = ac.currentTime, f = 784 * Math.pow(2, Math.min(step, 12) / 12);
      tone(t, 'sine', f, f * 0.995, 0.28, 0.45); tone(t, 'sine', f * 2, f * 2, 0.07, 0.25); },
  };
})();

const cancelRate = t => (t.shipped + t.cancelled) >= 20 ? t.cancelled / (t.shipped + t.cancelled) : 0;

function judgeDay(t){
  const debtBad = S.debt > debtLimit(), cancelBad = cancelRate(t) >= 0.5;
  const res = {warn:[]};
  if(debtBad){ if(S.warnDebt) return {over:'debt'}; S.warnDebt = 1; res.warn.push('debt'); } else S.warnDebt = 0;
  if(cancelBad){ if(S.warnCancel) return {over:'cancel'}; S.warnCancel = 1; res.warn.push('cancel'); } else S.warnCancel = 0;
  if(shipBad()){ if(S.warnShip) return {over:'ship'}; S.warnShip = 1; res.warn.push('ship'); } else S.warnShip = 0;
  if(lateBad(t)){ if(S.warnLate) return {over:'late'}; S.warnLate = 1; res.warn.push('late'); } else S.warnLate = 0;
  return res;
}

}

let drag = null, tap = null, trail = [];
function pt(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
const inR = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function applyRotation(rad, dir){
  rawRad += rad;
  // 모터 한계: 쓸 수 있는 회전량(railBudget)만큼만 레일이 돈다. 넘치면 과열 표시
  const use = Math.min(rad, railBudget);
  railBudget -= use;
  if(rad - use > 0.001){ overheat = Math.min(1, overheat + (rad - use) * 0.6); if(overheat > 0.3) SFX.grind(); }
  rad = use;
  if(rad <= 0) return;
  usedRad += rad; omegaDir = dir;
  tickAcc += rad;                                  // 15°마다 다이얼 딸깍
  let tk = 0;
  while(tickAcc >= TAU / 24){ tickAcc -= TAU / 24; if(tk++ < 2) SFX.tick(); }
  playerBob = 1;
  packRotate(rad, dir, true);
}
// 레일이 rad만큼 돌면 그만큼 포장 진행 (byHand: 손으로 돌렸는지 → 콤보·소리·안내)
function payBoost(cost){
  if(S.money < cost){ say(`💸 돈이 부족해요 (${fmt(cost)} 필요)`, '#dc2626', 1.4); return false; }
  S.money -= cost; S.today.mkt += cost; return true;
}
function startFever(){                // 자동 발동 (버튼 없음)
  if(feverT > 0 || (S.cd.fever || 0) > 0) return false;
  feverT = FEVER_DUR; S.cd.fever = FEVER_CD;
  say(`🔥 피버! ${FEVER_DUR}초간 한 바퀴 처리량 ×${FEVER_MULT}`, '#ea580c', 1.8); SFX.ding(8);
  return true;
}
function startRush(){
  if(rushT > 0 || (S.cd.rush || 0) > 0 || !payBoost(rushCost())) return false;
  rushT = RUSH_DUR; S.cd.rush = RUSH_CD;
  say(`⚡ 러시 아워! ${RUSH_DUR}초간 처리량 ×${RUSH_MULT} · 속도 ×${RUSH_SPEED}`, '#ca8a04', 2);
  SFX.ding(4); setTimeout(() => SFX.ding(9), 120);
  return true;
}
let batchCarry = 0, batchDots = 0;
let sliceN = 0, turnN = 0, turnPay = 0, turnCnt = 0;
function packRotate(rad, dir, byHand){
  const g = gear(), rr2 = rad * g;
  railAngle += rad * Math.min(g, 3) * dir;   // 보이는 회전은 최대 3배까지만 (너무 빨리 돌면 눈 아픔)
  railMoveT = 0.25;
  const o = playerTarget();
  if(!o){
    if(byHand){ hintMsg = (S.stock <= 0 && S.orders.length) ? '재고가 없어요! 적치 랙을 탭해서 입고' : '대기 중인 주문이 없어요'; hintT = 1.2; }
    return;
  }
  manual += rr2;
  const SL = TAU / SLICES;
  while(manual >= SL){                        // 레일 1/8바퀴마다 그 몫만큼 포장 → 산이 앞에서부터 깎여 나감
    manual -= SL;
    packBatch(byHand, 1 / (SLICES * g));
    if(++sliceN >= SLICES * g){ sliceN = 0; turnDone(byHand); }
    if(!playerTarget()){ manual = 0; break; }
  }
}
// 손 한 바퀴 분량이 끝날 때: 콤보·효과음·금액 표시는 여기서 한 번만
function turnDone(byHand){
  if(!turnCnt) return;
  fx.texts.push({x:cx - R * 0.15, y:cy - R * 0.7, text:`+${fmt(turnPay)} · ${fmtN(turnN)}건`, color:'#16a34a', life:1.3});
  turnPay = 0; turnN = 0; turnCnt = 0;
  if(!byHand) return;
  combo++; comboT = COMBO_GAP; comboPop = 1;
  if(combo >= FEVER_COMBO) startFever();
  SFX.clunk();
  if(combo % 10 === 0) SFX.ding(combo / 10);
  if(combo > (S.maxCombo || 0)) S.maxCombo = combo;
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
}
function packBatch(byHand, frac = 1){
  let cap = perRev() * frac + batchCarry, cnt = 0, sumN = 0, sumPay = 0;
  batchDots = 0;
  while(true){
    const t = playerTarget();
    if(!t || cap < (t.size || 1)) break;
    const n = t.n || 1;
    const pay = complete(t, cx - R * 0.15, cy - R * 0.4, byHand, true);
    if(!pay) break;
    cap -= (t.size || 1); cnt++; sumN += n; sumPay += pay;
  }
  batchCarry = playerTarget() ? Math.min(cap, 1.5) : 0;      // 남은 몫은 다음 조각으로 이월
  if(!cnt) return;
  fx.pop = 1;
  spawnOutflow(Math.max(1, batchDots));     // 들어간 점 개수만큼 1:1로 택배가 나감
  turnPay += sumPay; turnN += sumN; turnCnt += cnt;
  SFX.pack();
}
cv.addEventListener('pointerdown', e => {
  SFX.unlock();
  const p = pt(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
  if(inR(p, rushBtn)){ startRush(); tap = null; return; }
  if(inR(p, L.pack) && !inR(p, L.pack.lab)){
    const fixed = S.spin === 'ccw' ? -1 : S.spin === 'cw' ? 1 : 0;   // 화면 좌표(y 아래) 기준: 반시계 = 음수 각도
    drag = {id:e.pointerId, last:Math.atan2(p.y - cy, p.x - cx), dir:fixed, fixed, acc:0, back:0};
    trail = [{x:p.x, y:p.y, t:performance.now()}];
  } else tap = {id:e.pointerId, x:p.x, y:p.y};
});
cv.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const p = pt(e);
  trail.push({x:p.x, y:p.y, t:performance.now()});
  const dist = Math.hypot(p.x - cx, p.y - cy);
  const a = Math.atan2(p.y - cy, p.x - cx);
  let d = a - drag.last;
  if(d > Math.PI) d -= TAU; if(d < -Math.PI) d += TAU;
  drag.last = a;
  if(dist < R * 0.35) return;
  if(!drag.dir){
    drag.acc += d;
    if(Math.abs(drag.acc) > 0.35){ drag.dir = Math.sign(drag.acc); applyRotation(Math.abs(drag.acc), drag.dir); }
    return;
  }
  const g = d * drag.dir;
  if(g > 0){ drag.back = 0; applyRotation(g, drag.dir); }
  else if(!drag.fixed){ drag.back -= g; if(drag.back > 1.2){ drag.dir = -drag.dir; drag.back = 0; } }
});
function endPointer(e){
  if(drag && e.pointerId === drag.id) drag = null;
  if(tap && e.pointerId === tap.id){
    const p = pt(e);
    if(Math.hypot(p.x - tap.x, p.y - tap.y) < 14){
      const z = ZONES.find(z => inR(p, z.k === 'pack' ? L.pack.lab : L[z.k]));
      if(z) openSheet(z.sheet); else closeSheet();
    }
    tap = null;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { drag = null; tap = null; });
// 손가락이 화면 밖/다른 요소에서 떨어져도 '그리는 중' 상태가 남지 않게
cv.addEventListener('lostpointercapture', e => { if(drag && e.pointerId === drag.id) drag = null; });

function perfWatch(dt){
  if(document.hidden) return;
  perfT += dt; perfN++;
  if(perfT < 1.5) return;
  const fps = perfN / perfT; perfT = 0; perfN = 0;
  if(fps < 50){ if(++perfSlow >= 2 && dprCap > 1){ dprCap = Math.max(1, Math.min(dprCap, window.devicePixelRatio || 1) - 0.25); perfSlow = 0; resize(); } }
  else perfSlow = 0;
}
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2, dprCap);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  layout();
}

let sheet = null, rowEls = [], sheetSig = '';
function bindHold(btn, def){
  let timer = null, delay = 380, n = 0;
  const stop = () => { if(timer){ clearTimeout(timer); timer = null; } if(n){ n = 0; save(); } };
  const fire = () => { if(!btn.isConnected || !def.ok()){ stop(); return false; } def.act(); n++; refresh(); return true; };
  const loop = () => { if(!fire()) return; delay = Math.max(45, delay * 0.8); timer = setTimeout(loop, delay); };
  btn.addEventListener('pointerdown', e => {
    if(e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); stop(); delay = 380;
    if(fire()) timer = setTimeout(loop, delay);
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); if(fire()) stop(); } });
}
function openSheet(k){
  sheet = k; S.seenSheet = true;
  $('sheetTitle').textContent = SHEETS[k];
  const box = $('rows'); box.innerHTML = '';
  sheetSig = k === 'sales' ? salesSig() : '';
  rowEls = (k === 'sales' ? salesRows() : ROWS[k]).map(def => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span class="dot" style="background:${def.color}"></span><div class="info"><div class="t"></div><div class="d"></div></div><button></button>`;
    const el = {def, t:row.querySelector('.t'), d:row.querySelector('.d'), b:row.querySelector('button')};
    if(def.once) el.b.addEventListener('click', () => { if(def.ok()){ def.act(); refresh(); save(); } });
    else bindHold(el.b, def);
    box.appendChild(row); return el;
  });
  $('sheet').classList.add('open');
  refresh();
}
function closeSheet(){ sheet = null; $('sheet').classList.remove('open'); }
$('sheetClose').onclick = closeSheet;
$('mktBtn').onclick = () => sheet === 'mkt' ? closeSheet() : openSheet('mkt');
$('salesBtn').onclick = () => sheet === 'sales' ? closeSheet() : openSheet('sales');

function setText(el, v){ if(el.textContent !== v) el.textContent = v; }
const etaHist = [];
function refresh(){
  if(sheet === 'sales' && salesSig() !== sheetSig){ const sc = $('rows').scrollTop; openSheet('sales'); $('rows').scrollTop = sc; return; }
  for(const el of rowEls){
    setText(el.t, el.def.title()); setText(el.d, el.def.desc()); setText(el.b, el.def.btn());
    el.b.disabled = !el.def.ok();
    el.b.classList.toggle('alt', !!(el.def.alt && el.def.alt()));
  }
  setText($('money'), fmt(S.money));
  setText($('earned'), '누적 ' + fmt(S.earned || 0));
  setText($('stock'), `${S.stock}/${S.cap}`);
  $('stockStat').classList.toggle('warn', S.stock <= Math.max(2, S.cap * 0.15));
  setText($('clock'), `D${S.day} ${clockStr()}`);
  {
    const p = S.served / WORLD * 100;
    const pct = p <= 0 ? '0' : p >= 100 ? '100' : p >= 1 ? p.toFixed(2) : p.toFixed(Math.min(8, Math.max(3, Math.ceil(-Math.log10(Math.max(p, 1e-9))) + 2)));
    const si = Math.min(S.st, STAGES.length - 1), stg = STAGES[si], prev = si ? STAGES[si - 1].goal : 0;
    const k = S.st >= STAGES.length ? 1 : Math.min(1, Math.max(0, (S.served - prev) / (stg.goal - prev)));
    const left = S.st >= STAGES.length ? `🏆 클리어 · ${fmtTime(S.playTime)}` : `${stg.icon} ${stg.name} ${fmtN(S.served)} / ${fmtN(stg.goal)}명`;
    // 다음 단계까지 예상 시간 (최근 1분 속도 기준) — 오래 걸리면 핵심 업그레이드 힌트
    const tn = performance.now() / 1000;
    etaHist.push([tn, S.served]); while(etaHist.length > 2 && tn - etaHist[0][0] > 60) etaHist.shift();
    let eta = '';
    if(S.st < STAGES.length && tn - etaHist[0][0] > 15){
      const rate = (S.served - etaHist[0][1]) / (tn - etaHist[0][0]);
      if(rate > 0){
        const m = (stg.goal - S.served) / rate / 60;
        eta = m < 1 ? ' · ⏱ 곧 다음 단계' : m > 120 ? ' · ⏱ 지금 속도론 2시간+' : ` · ⏱ 약 ${Math.ceil(m)}분`;
        if(m > 20) eta += ' 💡📈물량↑';
      }
    }
    const narrow = innerWidth < 520 && eta;
    // 좁은 화면에서도 단계 이름(서울·대한민국…)은 꼭 보이게 — 대신 별점·힌트 글자를 줄임
    const right = narrow && S.st < STAGES.length ? `${stg.icon} ${stg.name} ${fmtN(S.served)}/${fmtN(stg.goal)}` : left;
    const etaN = narrow ? eta.replace(' 💡📈물량↑', ' 💡📈').replace('지금 속도론 2시간+', '2시간+') : eta;
    const g = `<span>🌍 ${narrow ? '' : '인류의 '}${pct}%${narrow ? '' : ` · ⭐${(S.rating || 4).toFixed(1)}`}${etaN}</span><span>${right}</span>`;
    const gt = $('goalText'); if(gt._h !== g){ gt.innerHTML = g; gt._h = g; }
    $('goalFill').style.width = (k * 100).toFixed(1) + '%';
  }
  setText($('debt'), S.debt > 0 ? ' · 빚 ' + fmtN(S.debt) : '');
  $('moneyStat').classList.toggle('indebt', S.debt > 0);
  const bh = S.boosts.map(b => `<span>${BOOSTS[b.k].icon} ${Math.ceil(b.t)}s</span>`).join('');
  const bb = $('boostBar'); if(bb._h !== bh){ bb.innerHTML = bh; bb._h = bh; }
  $('mktBtn').classList.toggle('ready', sheetBadge('mkt'));
  $('salesBtn').classList.toggle('ready', sheetBadge('sales'));
  const bn = $('banner');
  const parts = [];
  if(S.cutIdx < CUTOFFS.length && !S.night){
    const h = CUTOFFS[S.cutIdx], sec = (h * 60 - gameMin()) / 540 * DAY_SEC;
    if(sec <= 35) parts.push(`⏰ ${h}:00 ${h === 18 ? '마지막 ' : ''}집하 마감 ${Math.ceil(sec)}초 · 미출고 ${S.orders.length}건`);
  }
  if(isFinal() && !S.night) parts.push('🛍️ 글로벌 블랙프라이데이 · 주문 ×3 폭주 중!');
  if(!S.night){
    if(S.warnDebt) parts.push(S.debt > debtLimit() ? `🚨 빚이 한도 초과 — 오늘 정산 전까지 ${fmt(S.debt - debtLimit())} 갚아야 해요` : '✅ 빚이 한도 안으로 들어왔어요');
    if(S.warnLate) parts.push(`🚨 지연 경고 · 오늘 기한 초과 ${S.today.expired || 0} / 출고 ${S.today.shipped}`);
    if(S.warnShip) parts.push(`🚨 미출고 경고 · 기한 넘긴 대기 ${staleN()}묶음 / 오늘 출고 ${S.today.shipped}`);
    if(S.warnCancel){ const t = S.today, n = t.shipped + t.cancelled; parts.push(`🚨 고객 이탈 경고 · 오늘 취소율 ${n ? Math.round(t.cancelled / n * 100) : 0}%`); }
  }
  if(parts.length){
    bn.classList.remove('hidden'); bn.classList.add('live');
    setText(bn, parts.join('  ·  ') + (S.event && S.event.phase === 'live' ? `  ·  ${EVENTS[S.event.i].icon} ×${EVENTS[S.event.i].mult}` : ''));
  } else if(S.event){
    const d = EVENTS[S.event.i], t = Math.ceil(S.event.t);
    const who = d.only ? ` (${chDef(d.only).name})` : '';
    bn.classList.remove('hidden'); bn.classList.toggle('live', S.event.phase === 'live');
    setText(bn, S.event.phase === 'warn'
      ? `⚠️ ${t}초 후 ${d.icon} ${d.name}${who} ×${d.mult}`
      : `${d.icon} ${d.name}${who} ×${d.mult} · ${t}초`);
  } else bn.classList.add('hidden');
}

$('resetBtn').onclick = () => {
  if(!resetArm){ resetArm = true; $('resetBtn').textContent = '정말요? 한 번 더 누르면 초기화'; return; }
  S = applyPerks(fresh()); manual = 0; ants.clear(); crowds.clear(); leaving.length = 0; outflow.length = 0; batchCarry = 0; $('report').classList.add('hidden'); fx.truck = {load:0, state:'idle', t:0}; save(); saveMorning(); $('menu').classList.add('hidden'); closeSheet();
};

// ═════ 메인 루프 ═════
let last = performance.now(), uiT = 0, saveT = 0, errCount = 0;
function loop(t){
  now = t;
  const rawDt = (t - last) / 1000, dt = Math.min(0.1, rawDt); last = t;
  if(rawDt < 0.5) perfWatch(rawDt);
  // 한 프레임에서 오류가 나도 게임 전체가 멈추지 않게
  try{ if(W > 0 && !S.night && $('ending').classList.contains('hidden')) update(dt); }
  catch(err){ console.error('[update]', err); errCount++; }
  try{ if(W > 0) draw(); }
  catch(err){ console.error('[draw]', err); errCount++; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; }
  uiT += dt; if(uiT > 0.2){ uiT = 0; refresh(); }
  saveT += dt; if(saveT > 5){ saveT = 0; save(); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
window.addEventListener('pagehide', save);
$('repayBtn').onclick = repay;
$('menuRepay').onclick = repay;
$('nextDay').onclick = nextDay;
$('goRetry').onclick = retryMorning;
$('goNew').onclick = () => { S = applyPerks(fresh()); resetTransient(); save(); saveMorning(); $('gameover').classList.add('hidden'); closeSheet(); };
$('endContinue').onclick = () => $('ending').classList.add('hidden');
$('endNew').onclick = () => { S = applyPerks(fresh()); manual = 0; ants.clear(); crowds.clear(); leaving.length = 0; outflow.length = 0; batchCarry = 0; combo = 0; fx.truck = {load:0, state:'idle', t:0}; save(); saveMorning(); $('ending').classList.add('hidden'); closeSheet(); };
// ═════ 🌀 환생 창 ═════
let rbArm = 0;
function renderRebirth(){
  const g = fameGain();
  $('rbInfo').innerHTML = canRebirth()
    ? `지금 환생하면 <b>⭐ ${g} 명성</b>을 받고 처음부터 다시 시작해요.<br>돈·업그레이드·단계는 초기화, <b>명성과 명성 상점 보너스는 계속 남아요.</b>${S.ended ? '' : '<br><small>더 멀리 갈수록 명성을 더 받아요 (전 인류 클리어 +20)</small>'}`
    : `🇰🇷 대한민국 단계부터 환생할 수 있어요.<br>지금 커버: ${fmtN(S.served)}명 (환생 시 ⭐ ${g})`;
  const go = $('rbGo');
  go.disabled = !canRebirth();
  go.classList.toggle('arm', rbArm > 0);
  go.textContent = !canRebirth() ? '🔒 대한민국 단계부터' : rbArm > 0 ? `정말 환생할까요? 한 번 더 누르면 ⭐ +${g}` : `🌀 환생하기 (⭐ +${g})`;
  $('rbFame').textContent = `⭐ ${META.fame} 보유 · ${META.runs}회 환생`;
  const box = $('rbRows'); box.innerHTML = '';
  for(const pk of PERKS){
    const l = pl(pk.k), max = l >= pk.max, c = pk.cost(l);
    const row = document.createElement('div'); row.className = 'rbRow';
    row.innerHTML = `<div class="i"><div class="t">${pk.icon} ${pk.name} Lv.${l}${max ? ' (최대)' : ''}</div><div class="d">${max ? '최대 레벨' : pk.desc(l)}</div></div>`;
    const b = document.createElement('button');
    b.textContent = max ? 'MAX' : `⭐ ${c}`;
    b.disabled = max || META.fame < c;
    b.onclick = () => { if(max || META.fame < c) return; META.fame -= c; META.p[pk.k] = l + 1; saveMeta(); SFX.ding(1); renderRebirth(); };
    row.appendChild(b); box.appendChild(row);
  }
}
function openRebirth(){ rbArm = 0; $('menu').classList.add('hidden'); $('ending').classList.add('hidden'); renderRebirth(); $('rebirth').classList.remove('hidden'); }
function doRebirth(){
  const g = fameGain();
  META.fame += g; META.runs++; saveMeta();
  S = applyPerks(fresh()); resetTransient(); save(); saveMorning();
  $('rebirth').classList.add('hidden'); closeSheet();
  say(`🌀 환생 완료! ⭐ +${g} 명성 — ${META.runs}회차 시작`, '#7c3aed', 3);
  SFX.ding(3);
  rbArm = 0; renderRebirth(); $('rebirth').classList.remove('hidden');   // 바로 명성 상점에서 쓰게
}
$('rebirthBtn').onclick = openRebirth;
$('endRebirth').onclick = openRebirth;
$('rbClose').onclick = () => { rbArm = 0; $('rebirth').classList.add('hidden'); };
$('rebirth').addEventListener('pointerdown', e => { if(e.target === $('rebirth')){ rbArm = 0; $('rebirth').classList.add('hidden'); } });
$('rbGo').onclick = () => {
  if(!canRebirth()) return;
  if(rbArm > 0 && performance.now() - rbArm < 4000) return doRebirth();
  rbArm = performance.now(); renderRebirth();
  setTimeout(() => { if(rbArm && performance.now() - rbArm >= 4000){ rbArm = 0; if(!$('rebirth').classList.contains('hidden')) renderRebirth(); } }, 4100);
};
resize(); refresh(); requestAnimationFrame(loop);
try{ if(!localStorage.getItem(MORNING_KEY)) saveMorning(); }catch(e){}
if(S.over) showGameOver(); else if(S.night) showReport();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg => { reg.update().catch(() => {}); }).catch(() => {});
  // 새 버전이 설치되면 저장하고 한 번만 자동 새로고침 (예전 버전이 계속 뜨는 일 방지)
  let swReloaded = !navigator.serviceWorker.controller;   // 처음 설치 때는 새로고침 안 함
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(swReloaded) return; swReloaded = true; save(); location.reload(); });
}
